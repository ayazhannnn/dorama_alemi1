name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk dorama-${{ github.ref_name }}.apk
      - name: GitHub Release - DORA deployment оқиғасы
        uses: softprops/action-gh-release@v2
        with:
          files: dorama-${{ github.ref_name }}.apk
          generate_release_notes: true
