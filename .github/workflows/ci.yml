name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dorama_alem   # Flutter жобасы осы қосалқы папкада
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"   # жобадағы нұсқамен бірдей (Dart 3.9.2)
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Linter (flutter analyze)
        run: flutter analyze --no-fatal-infos
      - name: Unit/widget tests
        run: |
          if [ -d test ]; then flutter test; else echo "::warning::test/ папкасы жоқ"; fi
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorama-apk-${{ github.sha }}
          path: dorama_alem/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  dependency-scan:
    name: Dependency vulnerability scan (OSV + Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner (есеп)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest \
            scan source --lockfile=/src/dorama_alem/pubspec.lock
      - name: Trivy (есеп HIGH + CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed /src/dorama_alem
      - name: Trivy (қақпа - CRITICAL болса тоқтатады)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 /src/dorama_alem
