name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"   # жобадағы нұсқамен бірдей (Dart 3.9.2)
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Linter (flutter analyze)
        run: flutter analyze --no-fatal-infos
      - name: Unit/widget tests
        run: |
          if [ -d test ]; then flutter test; else echo "::warning::test/ папкасы жоқ - тест қосу керек"; fi
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorama-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  dependency-scan:
    name: Dependency vulnerability scan (OSV + Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock
      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
